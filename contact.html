<style>
  body.page-contact {
    --angle-base: 90deg;
    position: relative;
    height: auto;
    min-height: 100vh;
  }

  .contact-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 210px 4vw 60px;
  }

  /* the contour + all five balloons are baked into one image now
     (vis/contour_balloons.svg, exported already laid out as a halo),
     so there's no more separate per-balloon positioning to keep in
     sync - just transparent hit-regions placed on top at the same
     percentages the image itself uses, which is also why this scales
     cleanly to mobile without a second set of positions. */
  .contour-halo {
    position: relative;
    width: min(84vw, 820px);
    aspect-ratio: 954 / 822;
    margin: 0 auto;
  }

  .contour-img {
    display: block;
    width: 100%;
    height: 100%;
  }

  /*
    No CV file on the site yet. To wire this up: drop a PDF into the
    /downloads folder (e.g. downloads/CV-wies-ruyters.pdf), then set
    this link's href to it - the `download` attribute makes it save
    instead of navigating.
  */
  .cv-hit {
    position: absolute;
    left: 46.2%;
    top: 43.8%;
    width: 30.5%;
    height: 8.2%;
    cursor: pointer;
  }

  .social-balloon {
    position: absolute;
    cursor: pointer;
  }

  .social-balloon:hover,
  .social-balloon:focus-visible {
    filter: brightness(1.06);
  }

  .cv-hit:focus-visible,
  .social-balloon:focus-visible {
    outline: 2px dashed var(--navy);
    outline-offset: 3px;
  }

  .social-balloon--linkedin {
    left: 41.2%;
    top: 0.9%;
    width: 22.9%;
    height: 20.1%;
  }

  .social-balloon--github {
    left: 10%;
    top: 24.5%;
    width: 21.1%;
    height: 20.1%;
  }

  .social-balloon--youtube {
    left: 74.4%;
    top: 22.8%;
    width: 24.7%;
    height: 22.1%;
    cursor: default;
    /* no youtube URL yet - see the HTML comment above this element */
  }

  .social-balloon--scholar {
    left: 0.6%;
    top: 62.9%;
    width: 25.1%;
    height: 21.9%;
  }

  .social-balloon--bluesky {
    left: 71.3%;
    top: 60.8%;
    width: 28%;
    height: 24.2%;
  }

  @media (max-width: 900px) {
    .contact-page {
      justify-content: flex-start;
      padding: calc(var(--header-h) + 28px) 20px 30px;
    }

    /* the halo uses the same percentages at every width - it's one
       image, so it just scales down as a whole with the container */
    .contour-halo {
      width: min(90vw, 380px);
    }
  }
</style>
